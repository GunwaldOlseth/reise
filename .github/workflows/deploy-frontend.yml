name: Deploy frontend

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

env:
  GCP_PROJECT: homey-376215
  GCP_REGION: europe-north1
  SERVICE: reise-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check deploy secret
        run: |
          if [ -z "${{ secrets.SA_REISE }}" ]; then
            echo "::error::SA_REISE is not set. Add the deploy service account JSON in GitHub → Settings → Secrets → Actions, or run: bash scripts/setup-github-actions.sh <key.json>"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.SA_REISE }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source frontend \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT" \
            --allow-unauthenticated \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT" \
            --format='value(status.url)'
